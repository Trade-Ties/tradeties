# Test-only overrides. A separate file from src/main/resources/application.yml rather than a
# copy of it: both are loaded, so everything not named here keeps the value the application
# ships with, and this file cannot drift into being a second configuration.

# The one setting that must never be on in a test run. @EnableScheduling is application-wide,
# so without this the geocode refiner wakes up during ./mvnw verify and calls the real US
# Census service -- from every developer's machine and from CI, for as long as the suite runs.
# Nothing in the suite needs it: GeocodeRefinerTests drives the pass by calling it.
tradeties.census.refiner.enabled=false

# Points the client at a host that does not resolve, so a test that somehow reached the network
# fails loudly instead of quietly succeeding against the real service.
tradeties.census.base-url=https://census.invalid

# The same reasoning for the mail outbox: a pass on its own timer would send mail in the middle of
# a test that is counting rows. OutboxSenderTests drives the sender by calling it.
tradeties.mail.sender.enabled=false

# A test that publishes a business and then counts would otherwise read a count taken before it.
tradeties.marketplace.summary-ttl=0s
