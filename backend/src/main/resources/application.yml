spring:
  application:
    name: tradeties-backend

  # Java 25 + Boot 4: request handling on virtual threads. Safe here because
  # JDK 24+ no longer pins a virtual thread inside synchronized blocks.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tradeties}
    username: ${DATABASE_USER:tradeties}
    password: ${DATABASE_PASSWORD:tradeties}

  jpa:
    # Flyway owns the schema. Hibernate is only allowed to check that the code
    # still matches it — never to change it. This is the single setting that
    # keeps a JPA codebase honest over years.
    hibernate:
      ddl-auto: validate
    # No lazy loading outside a transaction: forces explicit, intentional fetching.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # The contract answers every error with application/problem+json (RFC 9457). Without
  # this, Spring renders its own error shape and the Problem schema would be a promise
  # the API does not keep.
  mvc:
    problemdetails:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          # WorkOS AuthKit publishes a JWKS per client id. Kept instead of
          # issuer-uri only because the decoder is still built by hand in
          # SecurityConfig — discovery does exist, see the note below.

          # explicitly in SecurityConfig instead.
          jwk-set-uri: https://api.workos.com/sso/jwks/${WORKOS_CLIENT_ID:missing-client-id}

# The issuer is CLIENT-SCOPED — not a shared "https://api.workos.com" that every
# tenant gets. Read from the horse's mouth rather than assumed:
#
#   curl https://api.workos.com/user_management/<client_id>/.well-known/openid-configuration
#   -> "issuer":   "https://api.workos.com/user_management/<client_id>"
#      "jwks_uri": "https://api.workos.com/sso/jwks/<client_id>"     (matches the above)
#
# JwtIssuerValidator compares this string exactly, with no normalisation. Getting it
# wrong does not fail at startup — it turns every request into a 401 whose only clue
# sits in the WWW-Authenticate header. Override only for a custom auth domain.
workos:
  issuer: https://api.workos.com/user_management/${WORKOS_CLIENT_ID:missing-client-id}

server:
  # Traefik terminates TLS and sits in front of this service.
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.modulith: INFO
