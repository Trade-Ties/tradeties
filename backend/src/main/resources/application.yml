spring:
  application:
    name: tradeties-backend

  # Java 25 + Boot 4: request handling on virtual threads. Safe here because
  # JDK 24+ no longer pins a virtual thread inside synchronized blocks.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tradeties}
    username: ${DATABASE_USER:tradeties}
    password: ${DATABASE_PASSWORD:tradeties}

  jpa:
    # Flyway owns the schema. Hibernate is only allowed to check that the code
    # still matches it — never to change it. This is the single setting that
    # keeps a JPA codebase honest over years.
    hibernate:
      ddl-auto: validate
    # No lazy loading outside a transaction: forces explicit, intentional fetching.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # The contract answers every error with application/problem+json (RFC 9457). Without
  # this, Spring renders its own error shape and the Problem schema would be a promise
  # the API does not keep.
  mvc:
    problemdetails:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          # WorkOS AuthKit publishes a JWKS per client id. Kept instead of
          # issuer-uri only because the decoder is still built by hand in
          # SecurityConfig — discovery does exist, see the note below.
          jwk-set-uri: https://api.workos.com/sso/jwks/${WORKOS_CLIENT_ID:missing-client-id}

# The issuer is CLIENT-SCOPED — not a shared "https://api.workos.com" that every
# tenant gets. Read from the horse's mouth rather than assumed:
#
#   curl https://api.workos.com/user_management/<client_id>/.well-known/openid-configuration
#   -> "issuer":   "https://api.workos.com/user_management/<client_id>"
#      "jwks_uri": "https://api.workos.com/sso/jwks/<client_id>"     (matches the above)
#
# JwtIssuerValidator compares this string exactly, with no normalisation. Getting it
# wrong does not fail at startup — it turns every request into a 401 whose only clue
# sits in the WWW-Authenticate header. Override only for a custom auth domain.
workos:
  issuer: https://api.workos.com/user_management/${WORKOS_CLIENT_ID:missing-client-id}

# Where a published profile is served, as it is printed on a van and read out over the phone.
# Only ever composed into messages written for a tradesperson — nothing routes on it. The wizard
# builds its links from the same variable, as NEXT_PUBLIC_PROFILE_URL_PREFIX, because the two
# appear a line apart: the URL field prints the prefix and the slug-locked 409 below it repeats.
tradeties:
  profile-url-prefix: ${PROFILE_URL_PREFIX:tradeties.com/pro/}

  # The US Census Bureau's public geocoder, which sharpens a ZIP centroid into a position
  # along the address range. Free, keyless and US-only -- and with no availability promise
  # attached, which is exactly why nothing on the write path waits for it. Configurable so a
  # test or an air-gapped environment can point it somewhere that is not the internet.
  census:
    base-url: ${CENSUS_GEOCODER_URL:https://geocoding.geo.census.gov}

    # Short on purpose. The caller already holds a usable point, so waiting is worth less
    # than giving up and trying again on the next pass. Read by CensusClientConfiguration,
    # which explains why they are not spring.http.client.* properties.
    connect-timeout: 3s
    read-timeout: 10s

    # The background pass that sharpens ZIP centroids into address-level points. It never
    # blocks anything -- every profile already has a point -- so the numbers below are about
    # being a good guest on a free public service, not about speed.
    refiner:
      # Off in tests, where the stand-in for the service is a mock and a real pass would
      # reach the internet. See src/test/resources/application.properties.
      enabled: ${CENSUS_REFINER_ENABLED:true}
      # Profiles per pass. Small: the queue drains on its own over hours, and there is
      # nothing waiting for it to finish.
      batch-size: 25
      interval: 5m
      # Long enough that startup and the first requests are done with the database first.
      initial-delay: 2m
      # How long before a profile is asked about again. Days rather than minutes, because
      # what is left in the queue after the first pass is mostly addresses the service will
      # never match -- and asking again quickly would be asking forever.
      retry-after: 30d

server:
  # Traefik terminates TLS and sits in front of this service.
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.modulith: INFO
